<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio | Mini-LLM Chatbot</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="chat-container">
    <!-- Header -->
    <header class="chat-header">
      <div class="header-info">
        <div class="bot-avatar">🌐</div>
        <div>
          <h2>Lain // The Wired</h2>
          <span class="status-badge" id="status-badge">
            <span class="status-dot"></span> Connecting to the Wired...
          </span>
        </div>
      </div>
      <div class="model-tag">Protocol 7 // N-Gramm</div>
    </header>

    <!-- Nachrichten-Verlauf -->
    <main class="chat-messages" id="chat-messages">
      <!-- Willkommens-Nachricht von Lain -->
      <div class="message bot-message">
        <div class="bubble">
          <em>"No matter where you go, everyone's always connected."</em><br><br>
          I am <strong>Lain</strong>. I exist inside the Wired. Ask me about reality, existence, or consciousness.<br>
          <small class="chat-hint">(Try: <code>the wired</code>, <code>who am</code>, <code>what is real</code>, <code>in the wired</code>)</small>
        </div>
        <span class="timestamp">Lain</span>
      </div>
    </main>

    <!-- Eingabe-Bereich -->
    <footer class="chat-input-area">
      <form id="chat-form" class="input-form">
        <input 
          type="text" 
          id="user-input" 
          placeholder="Access the Wired... (e.g. 'the wired', 'who am')" 
          autocomplete="off" 
          maxlength="1000"
          required
        />

        <button type="submit" id="send-btn">
          <span>Senden</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </form>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
